[supervisord]
nodaemon=true

[program:php-fpm]
command=docker-php-entrypoint php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Menggantikan /etc/cron.d/laravel-cron, yang tidak pernah jalan sama sekali.
# Ada tiga kesalahan sekaligus dan satu saja sudah cukup untuk mematikannya:
# crontab menunjuk /var/www/artisan (path asli /var/www/html/artisan),
# supervisord tidak pernah menjalankan daemon cron, dan file-nya ter-checkout
# dengan CRLF yang ditolak diam-diam oleh Debian cron.
#
# Akibatnya production:close-stale tidak pernah jalan — piring hari kemarin
# tidak pernah auto-waste, jadi "Get Data POS" terkunci selamanya.
#
# schedule:work adalah loop yang sama tanpa satu pun jebakan di atas: satu
# proses, path absolut, dan outputnya masuk `docker logs`. Hanya container
# `api` yang menjalankan ini — posdata-worker menimpa file ini dengan
# supervisord-worker.conf, jadi tidak ada scheduler dobel.
[program:schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
